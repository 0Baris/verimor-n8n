name: n8n node CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n8n-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm test

  package-consumer:
    needs: [quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: sh scripts/test-consumer.sh
      # Real n8n (pinned image) runs workflows against a loopback mock inside the container.
      - run: sh scripts/test-n8n-e2e.sh
